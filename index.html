<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام توليد بطاقات الدعوة - الميعاد</title>
  
  <!-- الخطوط والمكتبات البرمجية -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- مكتبات تنزيل جميع الصور في ملف ZIP مضغوط دفعة واحدة -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111111;
      color: #ffffff;
      min-height: 100vh;
      padding: 20px 10px;
      font-family: 'Cairo', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .control-panel {
      width: 100%;
      max-width: 500px;
      background: #ffffff;
      color: #333333;
      border-radius: 16px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      margin-bottom: 30px;
    }

    .file-box {
      border: 2px dashed #c9a24b;
      border-radius: 12px;
      padding: 15px;
      cursor: pointer;
      background: #fcfaf7;
      margin: 12px 0;
      transition: 0.3s;
    }
    .file-box:hover { background: #f7f1e9; }

    .btn {
      background: linear-gradient(135deg, #c9a24b, #8a6a24);
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }

    .btn-zip {
      background: linear-gradient(135deg, #2d6a4f, #1b4332);
      color: #ffffff;
    }

    .download-card-btn {
      background: #c9a24b;
      color: #000000;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    #cards-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      width: 100%;
    }

    .card-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 500px;
    }

    .card {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1.77;
      background: #000000;
      border-radius: 0;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .bg-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .dynamic-overlay {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -10%);
      width: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .entry-title {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 10px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
      letter-spacing: 0.5px;
    }

    .qr-box {
      background: transparent;
      padding: 0;
      border-radius: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: none;
    }

    .qr-box canvas {
      width: 135px !important;
      height: 135px !important;
      filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.7));
    }

    .guest-info {
      margin-top: 14px;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.95);
    }

    .guest-title { 
      font-size: 18px; 
      font-weight: 700; 
      opacity: 0.95;
    }

    .guest-name { 
      font-size: 23px; 
      font-weight: 800; 
      margin: 3px 0;
      color: #ffffff;
    }

    .guest-count { 
      font-size: 16px; 
      font-weight: 700; 
      margin-top: 2px;
      color: #f1f1f1;
    }

    @media print {
      body { background: white; padding: 0; }
      .control-panel, .download-card-btn { display: none !important; }
    }
  </style>
</head>
<body>

  <div class="control-panel">
    <h3 style="color: #c9a24b; font-size: 20px;">✨ نظام توليد بطاقات الدعوة</h3>
    <p style="font-size: 13px; color: #777; margin-top: 5px;">اختر خلفية وارفع ملف Excel لتوليد البطاقات</p>

    <!-- رفع خلفية -->
    <div class="file-box" onclick="document.getElementById('bgFile').click()">
      <span style="font-size: 24px;">🖼️</span>
      <p id="bgStatus" style="color: #c9a24b; font-size: 13px; font-weight: bold; margin-top: 4px;">
        اضغط لتغيير خلفية الدعوة (اختياري)
      </p>
      <input type="file" id="bgFile" accept="image/*" style="display:none" onchange="handleBgUpload(event)">
    </div>

    <!-- رفع ملف Excel -->
    <div class="file-box" onclick="document.getElementById('excelFile').click()">
      <span style="font-size: 28px;">📊</span>
      <p style="color: #c9a24b; font-size: 14px; font-weight: bold; margin-top: 6px;">اضغط هنا لرفع ملف Excel المدعوين</p>
      <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" style="display:none" onchange="handleExcelUpload(event)">
    </div>

    <!-- أزرار التحميل -->
    <button id="downloadZipBtn" class="btn btn-zip" style="display: none;" onclick="downloadAllAsZip()">📦 تحميل جميع البطاقات صور (ZIP)</button>
    <button id="printBtn" class="btn" style="display: none; background: #444;" onclick="window.print()">🖨️ طباعة الصفحة (PDF)</button>
  </div>

  <div id="cards-container"></div>

  <script>
    let currentBase64Image = 'bg.jpeg'; 
    let cachedGuestsList = [];

    function handleBgUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        currentBase64Image = e.target.result;
        document.getElementById('bgStatus').innerText = "✅ تم تحديث الخلفية بنجاح!";
        if (cachedGuestsList.length > 0) {
          renderCards(cachedGuestsList);
        }
      };
      reader.readAsDataURL(file);
    }

    function handleExcelUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

          let loadedGuests = [];
          rows.forEach((row) => {
            if (row && row[0]) {
              let name = row[0].toString().trim();
              let count = 1;

              if (row[1] !== undefined && row[1] !== null) {
                let parsed = parseInt(row[1], 10);
                if (!isNaN(parsed) && parsed > 0) {
                  count = parsed;
                }
              }

              if (name !== "" && name.toLowerCase() !== "الاسم" && name.toLowerCase() !== "name") {
                loadedGuests.push({ name: name, count: count });
              }
            }
          });

          if (loadedGuests.length > 0) {
            cachedGuestsList = loadedGuests;
            renderCards(loadedGuests);
            document.getElementById('downloadZipBtn').style.display = 'block';
            document.getElementById('printBtn').style.display = 'block';
          } else {
            alert("لم يتم العثور على أسماء في العمود الأول لملف Excel.");
          }
        } catch(err) {
          alert("حدث خطأ أثناء قراءة ملف Excel.");
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function renderCards(list) {
      const container = document.getElementById('cards-container');
      container.innerHTML = "";
      list.forEach((guest, index) => {
        createCard(guest.name, guest.count, index + 1);
      });
    }

    function createCard(guestName, guestCount, index) {
      const container = document.getElementById('cards-container');
      const qrData = `${guestName}|${guestCount}`; 
      const cardId = `card-${index}`;

      const cardHtml = `
        <div class="card-wrapper">
          <div class="card" id="${cardId}">
            <img src="${currentBase64Image}" class="bg-img" alt="Background" crossorigin="anonymous">

            <div class="dynamic-overlay">
              <div class="entry-title">بطاقة الدخول</div>
              
              <div class="qr-box">
                <canvas id="qr-${index}"></canvas>
              </div>

              <div class="guest-info">
                <div class="guest-title">المكرمة</div>
                <div class="guest-name">${guestName}</div>
                <div class="guest-count">عدد الضيوف : ${guestCount}</div>
              </div>
            </div>

          </div>
          
          <button class="download-card-btn" onclick="downloadAsImage('${cardId}', '${guestName}')">
            📥 تحميل البطاقة كصورة (PNG)
          </button>
        </div>
      `;

      container.insertAdjacentHTML('beforeend', cardHtml);

      new QRious({
        element: document.getElementById(`qr-${index}`),
        value: qrData,
        size: 300,
        backgroundAlpha: 0,
        foreground: '#ffffff',
        level: 'H'
      });
    }

    function downloadAsImage(cardId, guestName) {
      const cardElement = document.getElementById(cardId);
      
      html2canvas(cardElement, {
        scale: 2,
        useCORS: true,
        allowTaint: true,
        backgroundColor: null
      }).then(canvas => {
        const image = canvas.toDataURL("image/png");
        const link = document.createElement("a");
        link.href = image;
        link.download = `دعوة_${guestName}.png`;
        link.click();
      }).catch(err => {
        alert("حدث خطأ أثناء حفظ البطاقة.");
      });
    }

    // 💡 دالة جديدة لتجميع كافة الـ 140 صورة في ملف ZIP واحد وتنزل فورا!
    async function downloadAllAsZip() {
      const btn = document.getElementById('downloadZipBtn');
      btn.innerText = "⏳ جاري تحويل الصور وتجميع الملف...";
      btn.disabled = true;

      const zip = new JSZip();
      const folder = zip.folder("بطاقات_الدعوة");

      for (let i = 0; i < cachedGuestsList.length; i++) {
        const guest = cachedGuestsList[i];
        const cardElement = document.getElementById(`card-${i + 1}`);

        if (cardElement) {
          const canvas = await html2canvas(cardElement, { scale: 1.5, useCORS: true, allowTaint: true });
          const imgData = canvas.toDataURL("image/png").split(',')[1];
          folder.file(`دعوة_${guest.name}.png`, imgData, { base64: true });
        }
      }

      zip.generateAsync({ type: "blob" }).then(function(content) {
        saveAs(content, "جميع_بطاقات_الدعوة.zip");
        btn.innerText = "📦 تحميل جميع البطاقات صور (ZIP)";
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
